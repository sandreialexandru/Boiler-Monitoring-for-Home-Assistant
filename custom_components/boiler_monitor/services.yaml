reset_statistics:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: boiler_monitor

estimate_preheat:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: boiler_monitor
    target_temperature:
      required: false
      selector:
        number:
          min: 10
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    at:
      required: false
      example: "07:00"
      selector:
        time:
