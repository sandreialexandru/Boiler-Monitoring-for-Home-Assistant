# Example automations built on Boiler Monitor events.

# 1. Actionable alert with a link to the dashboard when short-cycling starts
- alias: "Boiler – short-cycling alert"
  triggers:
    - trigger: event
      event_type: boiler_monitor_short_cycle
  actions:
    - action: notify.mobile_app_my_phone
      data:
        title: "Boiler short-cycling"
        message: >
          {{ trigger.event.data.name }} restarted after
          {{ trigger.event.data.off_minutes }} min off.
        data:
          tag: boiler_short_cycle
          clickAction: /dashboard-boiler/boiler

# 2. Log every finished cycle to the logbook
- alias: "Boiler – log cycle"
  triggers:
    - trigger: event
      event_type: boiler_monitor_cycle_end
  actions:
    - action: logbook.log
      data:
        name: "{{ trigger.event.data.name }}"
        message: >
          burned {{ trigger.event.data.burn_minutes }} min
          (off before: {{ trigger.event.data.off_minutes_before }} min,
          outdoor {{ trigger.event.data.outdoor }}°C)
          {{ '– SHORT CYCLE' if trigger.event.data.short_cycle }}

# 3. Daily summary at 22:00
- alias: "Boiler – daily summary"
  triggers:
    - trigger: time
      at: "22:00:00"
  actions:
    - action: notify.mobile_app_my_phone
      data:
        title: "Boiler today"
        message: >
          {{ states('sensor.centrala_cycles_today') }} cycles
          ({{ states('sensor.centrala_short_cycles_today') }} short),
          {{ states('sensor.centrala_burn_time_today') }} h burning,
          condensing {{ states('sensor.centrala_condensing_ratio_24h') }}%.

# 4. Morning pre-heat: start heating early enough to have 21 °C at 07:00
#    (needs a thermostat in Boiler Monitor; a weather entity makes it use the forecast)
- alias: "Heating – morning pre-heat"
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: time
      after: "03:00:00"
      before: "07:00:00"
    - condition: numeric_state
      entity_id: climate.termostat
      attribute: temperature
      below: 21
  actions:
    - action: boiler_monitor.estimate_preheat
      data:
        target_temperature: 21
        at: "07:00"
      response_variable: preheat
    - if:
        - condition: template
          value_template: "{{ preheat.start_now }}"
      then:
        - action: climate.set_temperature
          target:
            entity_id: climate.termostat
          data:
            temperature: 21
